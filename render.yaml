services:
  - type: web
    name: ezri-api
    runtime: python
    buildCommand: "pip install -r api/requirements.txt"
    startCommand: "uvicorn server:app --app-dir api --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    envVars:
      - key: PAYPAL_BASE_URL
        value: https://api-m.sandbox.paypal.com
      - key: DEMO_EXPIRY_MINUTES
        value: 10
      - key: DATABASE_URL
        sync: false # Prisma Postgres pooled URL — set in Render dashboard, never commit
      - key: REDIS_URL
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: CLOUDFLARE_R2_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_R2_ACCESS_KEY_ID
        sync: false
      - key: CLOUDFLARE_R2_SECRET_ACCESS_KEY
        sync: false
      - key: CLOUDFLARE_R2_BUCKET_NAME
        sync: false
  - type: web
    name: ezri-web
    runtime: node
    buildCommand: "cd web && npm install -g pnpm@12.4.1 && pnpm install --frozen-lockfile && pnpm run build"
    startCommand: "cd web && ./node_modules/.bin/next start -p $PORT"
    envVars:
      - key: NODE_VERSION
        value: 22
