services:
  - type: web
    name: ezri-api
    runtime: python
    plan: free
    buildCommand: "pip install -r api/requirements.txt"
    startCommand: "uvicorn server:app --app-dir api --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    envVars:
      - key: PAYPAL_BASE_URL
        value: https://api-m.sandbox.paypal.com
      - key: DEMO_EXPIRY_MINUTES
        value: 10
      - key: DATABASE_URL
        sync: false # Prisma Postgres pooled URL — set in Render dashboard, never commit
      - key: REDIS_URL
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: CLOUDFLARE_R2_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_R2_ACCESS_KEY_ID
        sync: false
      - key: CLOUDFLARE_R2_SECRET_ACCESS_KEY
        sync: false
      - key: CLOUDFLARE_R2_BUCKET_NAME
        sync: false
  - type: web
    name: ezri-web
    runtime: image
    plan: free
    # Built and published by .github/workflows/web-ci-image.yml.
    # Builds run on GitHub's 16 GB runners, so Render never compiles the app.
    image:
      url: ghcr.io/an-nita-llc/ezri-web:latest
    healthCheckPath: /
