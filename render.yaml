services:
  - type: web
    name: ezri-api
    runtime: python
    buildCommand: "pip install -r api/requirements.txt"
    startCommand: "uvicorn server:app --app-dir api --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PAYPAL_BASE_URL
        value: https://api-m.sandbox.paypal.com
      - key: DEMO_EXPIRY_MINUTES
        value: 10
  - type: web
    name: ezri-web
    runtime: node
    buildCommand: "cd web && pnpm install --frozen-lockfile && pnpm run build"
    startCommand: "cd web && pnpm run start"
    # Set in Render dashboard after first deploy (baked at build time):
    # NEXT_PUBLIC_API_URL=https://ezri-api.onrender.com
