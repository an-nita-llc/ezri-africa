name: Web CI + image

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/web-ci-image.yml"
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web-ci-image.yml"
  workflow_dispatch:

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  verify:
    name: Typecheck and unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  image:
    name: Build and publish runtime image
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: web
          file: web/Dockerfile
          push: true
          tags: |
            ghcr.io/an-nita-llc/ezri-web:latest
            ghcr.io/an-nita-llc/ezri-web:sha-${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'https://api.ezri-africa.com' }}
            NEXT_PUBLIC_PAYPAL_CLIENT_ID=${{ vars.NEXT_PUBLIC_PAYPAL_CLIENT_ID }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Prove the published image actually boots and serves before Render
      # ever pulls it. A green build alone does not guarantee a runnable
      # standalone bundle (copied .next/static + public paths).
      - name: Smoke-test the runtime image
        run: |
          IMAGE="ghcr.io/an-nita-llc/ezri-web:sha-${GITHUB_SHA}"
          docker pull "$IMAGE"
          docker image inspect --format='image size: {{.Size}} bytes' "$IMAGE"
          docker run --rm -d --name ezri-web-smoke -p 3000:3000 -e PORT=3000 "$IMAGE"
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              echo "Runtime smoke test passed."
              docker stop ezri-web-smoke
              exit 0
            fi
            sleep 2
          done
          echo "Runtime smoke test failed; container logs:"
          docker logs ezri-web-smoke
          docker stop ezri-web-smoke
          exit 1

      # Optional: add the Render deploy hook as a repository secret to make
      # Render pull the fresh image automatically. Without it, trigger a
      # manual deploy in the Render dashboard after CI turns green.
      - name: Trigger Render deploy
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        run: curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK_URL"
